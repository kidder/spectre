name: Parse compiler

description: |
  Parse the compiler name and version from the input and set the environment
  variables CC, CXX, FC, COMPILER_ID, and COMPILER_VERSION.
  For nvcc, it sets CC, CXX, and FC to the host compilers (gcc, g++, gfortran).

inputs:
  compiler:
    description: Compiler to parse, e.g. 'gcc-10'
    required: true

outputs:
  c_compiler:
    description: "The C compiler"
    value: ${{ steps.generate-output.outputs.cc }}
  cxx_compiler:
    description: "The CXX compiler"
    value: ${{ steps.generate-output.outputs.cxx }}
  fortran_compiler:
    description: "The Fortran compiler"
    value: ${{ steps.generate-output.outputs.fc }}
  compiler_id:
    description: "The compiler id"
    value: ${{ steps.generate-output.outputs.id }}
  compiler_version:
    description: "The C compiler version"
    value: ${{ steps.generate-output.outputs.version }}

runs:
  using: "composite"
  steps:
    - id: generate-output
      run: |
        if [[ ${{ inputs.compiler }} =~ (gcc|clang|nvcc)-([0-9\.\-]+) ]]; then
          COMPILER_ID=${BASH_REMATCH[1]}
          COMPILER_VERSION=${BASH_REMATCH[2]}
          if [[ $COMPILER_ID = gcc ]]; then
            CC=gcc-${COMPILER_VERSION};
            CXX=g++-${COMPILER_VERSION};
            FC=gfortran-${COMPILER_VERSION};
          elif [[ $COMPILER_ID = clang ]]; then
            CC=clang-${COMPILER_VERSION};
            CXX=clang++-${COMPILER_VERSION};
            FC=gfortran-11;
          elif [[ $COMPILER_ID = nvcc ]]; then
            # Set host compilers
            CC=gcc;
            CXX=/usr/local/bin/nvcc_wrapper;
            FC=gfortran-11;
          fi
        fi
        echo "cc=$CC" >> $GITHUB_OUTPUT
        echo "cxx=$CXX" >> $GITHUB_OUTPUT
        echo "fc=$FC" >> $GITHUB_OUTPUT
        echo "id=$COMPILER_ID" >> $GITHUB_OUTPUT
        echo "version=$COMPILER_VERSION" >> $GITHUB_OUTPUT
      shell: bash
